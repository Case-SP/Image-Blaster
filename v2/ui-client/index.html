<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Recast</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- Sign in -->
    <section id="email-section" class="view auth">
      <p class="welcome" id="welcome-msg" hidden></p>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      <button type="button" id="email-btn" class="btn-primary">Send code</button>
      <p class="hint" id="email-msg"></p>
      <button type="button" id="have-code-btn" class="btn-link">I have an access code</button>
    </section>

    <section id="access-section" class="view auth" hidden>
      <label for="access-code">Access code</label>
      <input type="text" id="access-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      <button type="button" id="access-btn" class="btn-primary">Sign in</button>
      <p class="hint" id="access-msg"></p>
      <button type="button" id="back-to-email-btn" class="btn-link">Use email instead</button>
    </section>

    <section id="code-section" class="view auth" hidden>
      <label for="code">Code sent to <span id="code-email"></span></label>
      <input type="text" id="code" inputmode="numeric" pattern="[0-9]{4,10}" maxlength="10" placeholder="000000" autocomplete="one-time-code" required>
      <button type="button" id="code-btn" class="btn-primary">Verify</button>
      <button type="button" id="resend-btn" class="btn-link">Resend</button>
      <p class="hint" id="code-msg"></p>
    </section>

    <!-- App -->
    <section id="app-section" hidden>
      <header class="topbar">
        <div class="pill" id="pill">
          <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <textarea id="titles" rows="1" placeholder="Paste titles, one per line…  ⏎ to generate"></textarea>
        </div>

        <button type="button" class="bubble bubble-cart" id="cart-btn" title="Cartridge (click to cycle)">nolla</button>
        <button type="button" class="bubble" id="n-btn" title="Images per title (click to cycle)">3</button>
        <button type="button" class="bubble" id="model-btn" title="Model (click to cycle)" data-model="fal-ai/nano-banana-pro">nano</button>
        <button type="button" class="bubble bubble-dl" id="dl-btn" title="Download selected" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v12"></path>
            <path d="M6 12l6 6 6-6"></path>
            <path d="M5 20h14"></path>
          </svg>
          <span class="bubble-count" id="dl-count" hidden>0</span>
        </button>
      </header>

      <!-- Reference override status bar. Click the "+" to open a modal where
           you can drop images that steer the next sketch run. Persistent for
           the session; cleared on hard refresh. -->
      <div class="ref-tray" id="ref-tray">
        <div class="ref-tray-row">
          <div class="ref-tray-label">Sketch refs · <span id="ref-tray-stage">override off</span></div>
          <div class="ref-tray-thumbs" id="ref-tray-thumbs-mini"></div>
          <button type="button" class="ref-tray-add" id="ref-tray-open" title="Add reference images">+</button>
          <button type="button" class="ref-tray-clear" id="ref-tray-clear" title="Clear all" hidden>clear</button>
        </div>
      </div>

      <div class="status-strip" id="status-strip" hidden></div>
      <p class="totals" id="totals"></p>

      <div id="grid" class="grid"></div>
      <div id="grid-empty" class="grid-empty" hidden>No generations yet — paste titles above and press ⏎.</div>

      <!-- Product-cartridge staged funnel — replaces the flat grid when active -->
      <div id="funnel" class="funnel" hidden>
        <div class="funnel-col" data-stage="sketch">
          <div class="funnel-head"><span class="funnel-name">Sketch</span><span class="funnel-count" data-count></span></div>
          <div class="funnel-action" data-action></div>
          <div class="funnel-body" data-body></div>
          <div class="funnel-foot" data-foot></div>
        </div>
        <div class="funnel-col" data-stage="product-shot">
          <div class="funnel-head"><span class="funnel-name">Product</span><span class="funnel-count" data-count></span></div>
          <div class="funnel-action" data-action></div>
          <div class="funnel-body" data-body></div>
          <div class="funnel-foot" data-foot></div>
        </div>
        <div class="funnel-col" data-stage="in-situ">
          <div class="funnel-head"><span class="funnel-name">In-situ</span><span class="funnel-count" data-count></span></div>
          <div class="funnel-action" data-action></div>
          <div class="funnel-body" data-body></div>
          <div class="funnel-foot" data-foot></div>
        </div>
      </div>

      <button type="button" id="signout-btn" class="btn-link signout">Sign out</button>
    </section>
  </main>


  <!-- Reference override modal (drag images in here) -->
  <div id="ref-modal" class="ref-modal" hidden>
    <div class="ref-modal-stage glass-surface">
      <div class="ref-modal-head">
        <div class="ref-modal-title">Reference overrides</div>
        <div class="ref-modal-sub">Drop images to steer the next run for this stage. Replaces the cartridge defaults until you clear them.</div>
      </div>
      <div class="ref-modal-tabs" role="tablist" id="ref-modal-tabs">
        <button type="button" class="ref-modal-tab active" data-stage="sketch" role="tab">Sketch <span class="ref-tab-count" data-tab-count="sketch"></span></button>
        <button type="button" class="ref-modal-tab" data-stage="in-situ" role="tab">In-situ <span class="ref-tab-count" data-tab-count="in-situ"></span></button>
      </div>
      <div class="ref-modal-drop glass-surface" id="ref-modal-drop">
        <div class="ref-modal-drop-text">Drop images here<br><span>or click to browse</span></div>
        <input type="file" id="ref-modal-input" accept="image/*" multiple hidden>
      </div>
      <div class="ref-modal-thumbs" id="ref-modal-thumbs"></div>
      <div class="steer-section" id="steer-section" hidden>
        <div class="steer-label">Guide the prompt</div>
        <div class="steer-dropdowns" id="steer-dropdowns"></div>
      </div>
      <div class="ref-modal-actions">
        <button type="button" class="ref-modal-clear glass-surface" id="ref-modal-clear">Clear this stage</button>
        <button type="button" class="ref-modal-done" id="ref-modal-done">Done</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-stage">
      <img id="lb-img" alt="">
      <div class="lb-prompt" id="lb-prompt"></div>
      <div class="lb-meta" id="lb-meta"></div>
      <div class="lb-actions">
        <button type="button" id="lb-download" class="lb-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v12"></path>
            <path d="M6 12l6 6 6-6"></path>
            <path d="M5 20h14"></path>
          </svg>
          <span>Download</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Night-mode toggle. Tiny sun/moon in the bottom-right corner; click to flip
       theme. Preference persists in localStorage. The non-active icon hides via
       CSS so only one shape shows at a time. -->
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <line x1="12" y1="2" x2="12" y2="4"></line>
      <line x1="12" y1="20" x2="12" y2="22"></line>
      <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
      <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
      <line x1="2" y1="12" x2="4" y2="12"></line>
      <line x1="20" y1="12" x2="22" y2="12"></line>
      <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
      <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
    </svg>
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <script src="app.js"></script>
</body>
</html>
