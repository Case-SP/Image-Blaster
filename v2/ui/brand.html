<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recast — Brand Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, system-ui, sans-serif; background: #0e0f12; color: #e6e6e6; }
  header { padding: 14px 20px; border-bottom: 1px solid #222; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { color: #888; font-size: 12px; }
  header select, header button { background: #1a1c20; color: #e6e6e6; border: 1px solid #2a2d33; padding: 5px 10px; border-radius: 4px; font: inherit; }
  header button { cursor: pointer; }
  header button.primary { background: #2a5cdc; border-color: #2a5cdc; }
  header button.primary:hover { background: #3669e8; }
  header button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toast { margin-left: auto; font-size: 12px; color: #6dd07b; }
  .toast.err { color: #ff7a7a; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 0; min-height: calc(100vh - 53px); }
  .col { padding: 20px; overflow: auto; }
  .col + .col { border-left: 1px solid #222; }
  section { margin-bottom: 26px; }
  section > h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; }
  textarea, input[type="text"] { width: 100%; background: #16181c; color: #e6e6e6; border: 1px solid #2a2d33; border-radius: 4px; padding: 8px 10px; font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  textarea { resize: vertical; min-height: 60px; }
  textarea.tall { min-height: 140px; }
  textarea.json { min-height: 380px; font-size: 12px; line-height: 1.5; }
  .row { margin-bottom: 12px; }
  .row label { display: block; font-size: 11px; color: #999; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
  ul.list li input { flex: 1; }
  ul.list li button { background: transparent; color: #ff7a7a; border: 0; cursor: pointer; padding: 4px 8px; font-size: 16px; line-height: 1; }
  .add-row { display: flex; gap: 6px; margin-top: 6px; }
  .add-row input { flex: 1; }
  .add-row button { background: #1a1c20; color: #e6e6e6; border: 1px solid #2a2d33; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  .ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .ref { position: relative; aspect-ratio: 1; background: #16181c; border: 1px solid #2a2d33; border-radius: 4px; overflow: hidden; }
  .ref img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref .name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.75); color: #ddd; font-size: 9.5px; padding: 3px 5px; line-height: 1.25; word-break: break-all; }
  .ref .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff; border: 0; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; opacity: 0; transition: opacity 0.15s; }
  .ref:hover .x { opacity: 1; }
  .ref .x:hover { background: #c63838; }
  .upload { border: 2px dashed #2a2d33; border-radius: 6px; padding: 18px; text-align: center; color: #888; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .upload.over { border-color: #2a5cdc; color: #e6e6e6; }
  .upload input { display: none; }
  details { background: #16181c; border: 1px solid #2a2d33; border-radius: 4px; padding: 10px 12px; margin-top: 10px; }
  details summary { cursor: pointer; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }
  details textarea { margin-top: 10px; }
  .hint { font-size: 11px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Brand Studio</h1>
  <span class="sub">cartridge:</span>
  <select id="cart"></select>
  <button id="reload">Reload</button>
  <button id="save" class="primary" disabled>Save Profile</button>
  <span id="toast" class="toast"></span>
</header>
<main>
  <div class="col" id="left"></div>
  <div class="col" id="right"></div>
</main>

<script>
const $ = sel => document.querySelector(sel);
let state = { cart: null, profile: null, refs: [], dirty: false };

// Admin key handling: /api is prod-guarded when SUPABASE_URL is set.
// Stored in sessionStorage so it survives reloads but not closing the tab.
function getAdminKey() {
  let k = sessionStorage.getItem('admin-key');
  if (!k) {
    k = prompt('Admin key (ADMIN_MASTER_KEY from .env, or leave blank if local-only):') || '';
    sessionStorage.setItem('admin-key', k);
  }
  return k;
}
const _origFetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  if (typeof url === 'string' && url.startsWith('/api/')) {
    const k = getAdminKey();
    if (k) {
      opts.headers = { ...(opts.headers || {}), 'x-admin-key': k };
    }
  }
  return _origFetch(url, opts);
};

function setToast(msg, isErr) {
  const el = $('#toast');
  el.textContent = msg || '';
  el.className = 'toast' + (isErr ? ' err' : '');
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
}

function markDirty() { state.dirty = true; $('#save').disabled = false; }

async function loadCarts() {
  const r = await fetch('/api/cartridges');
  const { cartridges } = await r.json();
  $('#cart').innerHTML = cartridges.map(c => `<option>${c}</option>`).join('');
  const saved = localStorage.getItem('brand-studio-cart');
  if (saved && cartridges.includes(saved)) $('#cart').value = saved;
  await loadCart();
}

async function loadCart() {
  const cart = $('#cart').value;
  state.cart = cart;
  localStorage.setItem('brand-studio-cart', cart);
  const r = await fetch(`/api/brand/${encodeURIComponent(cart)}`);
  if (!r.ok) { setToast('load failed', true); return; }
  const data = await r.json();
  state.profile = data.profile;
  state.refs = data.refs;
  state.dirty = false;
  $('#save').disabled = true;
  render();
}

function render() {
  const p = state.profile || {};
  const dna = p.brand_dna || {};
  const axes = p.visual_axes || {};
  const adj = p.adjacencies || {};
  const touchstones = adj.cultural_touchstones || [];
  const aliases = adj.axis_aliases || {};

  $('#left').innerHTML = `
    <section>
      <h2>Identity</h2>
      <div class="row">
        <label>Brand name</label>
        <input type="text" data-bind="brand_name" value="${esc(p.brand_name || '')}">
      </div>
      <div class="row">
        <label>Input mode</label>
        <input type="text" data-bind="input_mode" value="${esc(p.input_mode || '')}">
      </div>
    </section>

    <section>
      <h2>Pillars</h2>
      <div class="row">
        <label>Visual signature</label>
        <textarea class="tall" data-bind="brand_dna.visual_signature">${esc(dna.visual_signature || '')}</textarea>
      </div>
      <div class="row">
        <label>Mandatory elements</label>
        <textarea class="tall" data-bind="brand_dna.mandatory_elements">${esc(dna.mandatory_elements || '')}</textarea>
      </div>
      <div class="row">
        <label>Forbidden</label>
        <textarea class="tall" data-bind="brand_dna.forbidden">${esc(dna.forbidden || '')}</textarea>
      </div>
    </section>

    <section>
      <h2>Visual axes</h2>
      ${Object.keys(axes).map(k => `
        <div class="row">
          <label>${esc(k)}</label>
          <textarea data-bind="visual_axes.${k}">${esc(axes[k] || '')}</textarea>
        </div>
      `).join('')}
      <div class="add-row">
        <input type="text" id="new-axis-key" placeholder="new_axis_name (snake_case)">
        <button id="add-axis">+ axis</button>
      </div>
    </section>

    <section>
      <h2>Drift permission</h2>
      <textarea class="tall" data-bind="adjacencies.drift_permission">${esc(adj.drift_permission || '')}</textarea>
    </section>

    <section>
      <h2>Cultural touchstones (${touchstones.length})</h2>
      <ul class="list">
        ${touchstones.map((t, i) => `
          <li>
            <input type="text" data-list="cultural_touchstones" data-i="${i}" value="${esc(t)}">
            <button data-rm="cultural_touchstones" data-i="${i}">×</button>
          </li>
        `).join('')}
      </ul>
      <div class="add-row">
        <input type="text" id="new-touchstone" placeholder="new touchstone">
        <button id="add-touchstone">+ add</button>
      </div>
    </section>

    <section>
      <h2>Axis aliases</h2>
      ${Object.keys(aliases).map(k => `
        <div class="row">
          <label>${esc(k)} (${(aliases[k] || []).length})</label>
          <ul class="list">
            ${(aliases[k] || []).map((a, i) => `
              <li>
                <input type="text" data-alias-axis="${k}" data-i="${i}" value="${esc(a)}">
                <button data-rm-alias="${k}" data-i="${i}">×</button>
              </li>
            `).join('')}
          </ul>
          <div class="add-row">
            <input type="text" data-new-alias="${k}" placeholder="new alias for ${k}">
            <button data-add-alias="${k}">+</button>
          </div>
        </div>
      `).join('')}
    </section>

    <details>
      <summary>Raw JSON (advanced — overwrites the form on save)</summary>
      <textarea id="raw" class="json">${esc(JSON.stringify(state.profile, null, 2))}</textarea>
      <div class="hint">Edit + click "Apply raw" to push back into the form. Then "Save Profile" to write to disk.</div>
      <div class="add-row" style="margin-top:8px"><button id="apply-raw">Apply raw</button></div>
    </details>
  `;

  $('#right').innerHTML = `
    <section>
      <h2>References (${state.refs.length})</h2>
      <label class="upload" id="drop">
        <input type="file" id="file" accept=".jpg,.jpeg,.png,.webp" multiple>
        Drop / click to add images (jpg/png/webp)
      </label>
      <div class="ref-grid" style="margin-top:12px">
        ${state.refs.map(f => `
          <div class="ref" data-ref-name="${esc(f)}">
            <img loading="lazy" data-ref-src="${encodeURIComponent(f)}">
            <button class="x" data-rm-ref="${esc(f)}" title="Delete">×</button>
            <div class="name">${esc(f)}</div>
          </div>
        `).join('')}
      </div>
      <div class="hint">First 4 refs (alphabetical) reach fal.ai per request. Loader cap is 24.</div>
    </section>
  `;

  bindEvents();
  loadThumbs();
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setPath(obj, path, value) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = value;
}

function bindEvents() {
  document.querySelectorAll('[data-bind]').forEach(el => {
    el.addEventListener('input', () => {
      setPath(state.profile, el.dataset.bind, el.value);
      markDirty();
    });
  });
  document.querySelectorAll('[data-list]').forEach(el => {
    el.addEventListener('input', () => {
      const list = state.profile.adjacencies[el.dataset.list];
      list[parseInt(el.dataset.i)] = el.value;
      markDirty();
    });
  });
  document.querySelectorAll('[data-rm]').forEach(el => {
    el.addEventListener('click', () => {
      state.profile.adjacencies[el.dataset.rm].splice(parseInt(el.dataset.i), 1);
      markDirty();
      render();
    });
  });
  document.querySelectorAll('[data-alias-axis]').forEach(el => {
    el.addEventListener('input', () => {
      const list = state.profile.adjacencies.axis_aliases[el.dataset.aliasAxis];
      list[parseInt(el.dataset.i)] = el.value;
      markDirty();
    });
  });
  document.querySelectorAll('[data-rm-alias]').forEach(el => {
    el.addEventListener('click', () => {
      state.profile.adjacencies.axis_aliases[el.dataset.rmAlias].splice(parseInt(el.dataset.i), 1);
      markDirty();
      render();
    });
  });
  document.querySelectorAll('[data-add-alias]').forEach(btn => {
    btn.addEventListener('click', () => {
      const axis = btn.dataset.addAlias;
      const input = document.querySelector(`[data-new-alias="${axis}"]`);
      const v = input.value.trim();
      if (!v) return;
      if (!state.profile.adjacencies.axis_aliases[axis]) state.profile.adjacencies.axis_aliases[axis] = [];
      state.profile.adjacencies.axis_aliases[axis].push(v);
      markDirty();
      render();
    });
  });

  $('#add-touchstone')?.addEventListener('click', () => {
    const v = $('#new-touchstone').value.trim();
    if (!v) return;
    if (!state.profile.adjacencies) state.profile.adjacencies = {};
    if (!state.profile.adjacencies.cultural_touchstones) state.profile.adjacencies.cultural_touchstones = [];
    state.profile.adjacencies.cultural_touchstones.push(v);
    markDirty();
    render();
  });
  $('#add-axis')?.addEventListener('click', () => {
    const k = $('#new-axis-key').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
    if (!k) return;
    if (!state.profile.visual_axes) state.profile.visual_axes = {};
    state.profile.visual_axes[k] = '';
    if (!state.profile.adjacencies.axis_aliases[k]) state.profile.adjacencies.axis_aliases[k] = [];
    markDirty();
    render();
  });
  $('#apply-raw')?.addEventListener('click', () => {
    try {
      const next = JSON.parse($('#raw').value);
      state.profile = next;
      markDirty();
      render();
      setToast('raw applied — click Save to persist');
    } catch (e) { setToast('JSON parse error: ' + e.message, true); }
  });

  // Refs
  document.querySelectorAll('[data-rm-ref]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const f = btn.dataset.rmRef;
      if (!confirm(`Delete ${f}?`)) return;
      const r = await fetch(`/api/brand/${encodeURIComponent(state.cart)}/refs/${encodeURIComponent(f)}`, { method: 'DELETE' });
      if (!r.ok) { setToast('delete failed', true); return; }
      setToast('ref deleted');
      await loadCart();
    });
  });
  const drop = $('#drop'), file = $('#file');
  if (drop && file) {
    file.addEventListener('change', () => uploadFiles(file.files));
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('over');
      uploadFiles(e.dataTransfer.files);
    });
  }
}

async function loadThumbs() {
  const imgs = document.querySelectorAll('img[data-ref-src]');
  for (const img of imgs) {
    try {
      const f = img.dataset.refSrc;
      const r = await fetch(`/api/brand/${encodeURIComponent(state.cart)}/refs/${f}`);
      if (!r.ok) continue;
      const blob = await r.blob();
      img.src = URL.createObjectURL(blob);
    } catch {}
  }
}

async function uploadFiles(files) {
  if (!files || !files.length) return;
  let ok = 0, bad = 0;
  for (const f of files) {
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(f);
      });
      const resp = await fetch(`/api/brand/${encodeURIComponent(state.cart)}/refs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: f.name, dataUrl })
      });
      if (resp.ok) ok++; else bad++;
    } catch { bad++; }
  }
  setToast(`uploaded ${ok}${bad ? `, ${bad} failed` : ''}`, bad > 0);
  await loadCart();
}

async function saveProfile() {
  const r = await fetch(`/api/brand/${encodeURIComponent(state.cart)}/profile`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ profile: state.profile })
  });
  if (!r.ok) { const t = await r.text(); setToast('save failed: ' + t.slice(0, 80), true); return; }
  state.dirty = false;
  $('#save').disabled = true;
  setToast('saved ✓');
}

$('#cart').addEventListener('change', loadCart);
$('#reload').addEventListener('click', loadCart);
$('#save').addEventListener('click', saveProfile);
window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

loadCarts();
</script>
</body>
</html>
